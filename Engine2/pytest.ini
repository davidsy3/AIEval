[pytest]
# Only ever collect engine2/tests. The dataset's case folders contain their own
# test_functional.py / test_security.py files, which are ORACLES, not our tests:
# they need TARGET_MODULE and the case's own conftest, and collecting them here
# would fail. Stage 4 runs them deliberately, in a subprocess, in a temp copy.
testpaths = tests
norecursedirs = .venv results __pycache__ .pytest_cache ../dataset
addopts = -q
